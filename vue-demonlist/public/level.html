<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="level.css">
    <title>Document</title>
</head>
<body>
  <header>
    <div class="bg">
      <button class="backBtn" onclick="history.back()">⬅</button>
      <h1 class="logo"><span class="gd">GD</span> Demonlist</h1>
    </div>
  </header>

  <main>
    <div class="levelInfo">
      <div class="nameContainer">
        <b class="placement" id="placement"></b>
        <b id="name" class="name"></b>
      </div>
      <div class="verCon">
       <p id="verifier" class="verifier"></p>
      </div>
      <div class="imageCon">
        <img src="" id="image">
      </div>
        <div class="cardContainer">
          <div class="card">
            <p id="totalPoint" class="point"></p>
          </div>
          <div class="card">
            <p id="listPoint" class="list-point"></p>
            <p id="listPercent" class="list-percent"></p>
          </div>
          <div class="card">
            <p id="gameVersion" class="game-version"></p>
          </div>
          <div class="card">
            <p id="objects" class="object"></p>
          </div>
          <div class="card">
            <p id="ingameID" class="id"></p>
          </div>
        </div>

        <div class="recordCountCon">
          <p class="totalRecord" id="TR"></p>
          <p class="completeRecorcd" id="CR"></p>
        </div>

        <div class="recordsContainer" id="record">
          
        </div>
    </div>
  </main>

  <footer>
    <div class="bgFooter">

    </div>
  </footer>

    <script src="level.js"></script>
</body>
</html>
